name: Daily Update English
on:
  schedule:
    - cron: "0 0 * * *"  # 每天UTC0点（北京时间8点）运行
  workflow_dispatch:     # 支持手动触发
permissions:
  contents: write        # 直接赋予写权限，不用改仓库设置
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，避免冲突
      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4
      - name: 运行更新脚本
        run: python update.py
      - name: 自动提交并推送
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update daily content"
          file_pattern: "index.html"  # 只提交index.html
          push_options: "--force"     # 强制推送，避开冲突
